<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thalamai Gamers Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#000000,#0f2027,#203a43,#2c5364);
background-size:400% 400%;
animation:bg 8s ease infinite;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.login-box{
width:350px;
padding:35px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
box-shadow:0 0 30px cyan;
text-align:center;
color:white;
}

.login-box h1{
color:#00ffff;
margin-bottom:10px;
text-shadow:0 0 15px cyan;
}

.login-box h3{
margin-bottom:25px;
color:white;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
outline:none;
border-radius:10px;
background:rgba(255,255,255,.15);
color:white;
font-size:16px;
}

input::placeholder{
color:#ddd;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#00ffff;
color:black;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
margin-top:10px;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px cyan;
}

.footer{
margin-top:20px;
font-size:13px;
color:#ccc;
}
</style>

</head>

<body>

<div class="login-box">

<h1>🎮 THALAMAI GAMERS</h1>

<h3>Login</h3>

<input
type="text"
id="user"
placeholder="Username"
autocomplete="off">

<input
type="password"
id="pass"
placeholder="Password">

<button onclick="login()">LOGIN</button>

<div class="footer">
Premium Free Fire ID Store
</div>

</div>

<script>

function login(){

let username=document.getElementById("user").value.trim();
let password=document.getElementById("pass").value;

if(username==="thalamai" && password==="12345"){

alert("✅ Login Successful");

window.location.href="home.html";

}
else{

alert("❌ Wrong Username or Password");

}

}

document.addEventListener("keypress",function(e){

if(e.key==="Enter"){

login();

}

});

</script>

</body>
</html>
