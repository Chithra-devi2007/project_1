<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thalapathy Gamers — Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-orb one"></div>
<div class="glow-orb two"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5z" fill="#0A0812" stroke="#0A0812" stroke-width="0.5"/>
        <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Thalapathy Gamers</h1>
    <p class="sub">Login pannunga account access panna</p>

    <div class="error-msg" id="errorMsg">Username or password wrong! Try again.</div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>

    <p class="hint">Demo login: <b>thalapathy</b> / <b>gamers123</b></p>
  </div>
</div>

<script>
  // NOTE: This is a simple client-side demo login only.
  // It is NOT secure — anyone can view this code and see the password.
  // For a real website, authentication must be checked on a server/database.
  const DEMO_USER = "thalapathy";
  const DEMO_PASS = "gamers123";

  const form = document.getElementById("loginForm");
  const errorMsg = document.getElementById("errorMsg");

  form.addEventListener("submit", function(e){
    e.preventDefault();
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();

    if(u === DEMO_USER && p === DEMO_PASS){
      sessionStorage.setItem("tg_logged_in", "true");
      window.location.href = "index.html";
    } else {
      errorMsg.style.display = "block";
    }
  });
</script>

</body>
</html>
