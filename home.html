<!DOCTYPE html>
<html>
<head>
  <title>Thalamai Gamers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{
      background:#050816;
      color:white;
      overflow-x:hidden;
    }

    /* Hero Section */
    .hero{
      height:100vh;
      background:url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      position:relative;
    }
    .hero::after{
      content:'';
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.55);
    }
    .hero-content{
      position:relative;
      z-index:1;
      animation:float 3s ease-in-out infinite;
    }
    .hero img{
      width:280px;
      filter:drop-shadow(0 0 25px #00ffe5);
    }
    .hero h1{
      font-size:48px;
      color:#00ffe5;
      text-shadow:0 0 20px #00ffe5;
      margin-top:20px;
    }
    .hero p{
      margin-top:10px;
      color:#ddd;
      font-size:18px;
    }

    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-15px)}
    }

    /* Cards */
    .section{
      padding:60px 20px;
      text-align:center;
    }
    .section h2{
      font-size:36px;
      margin-bottom:40px;
      color:#00ffe5;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
      max-width:1100px;
      margin:auto;
    }

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:20px;
      overflow:hidden;
      backdrop-filter:blur(12px);
      transform-style:preserve-3d;
      transition:0.5s;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }
    .card:hover{
      transform:rotateY(10deg) rotateX(8deg) scale(1.05);
      box-shadow:0 20px 40px rgba(0,255,229,0.4);
    }

    .card img{
      width:100%;
      height:260px;
      object-fit:cover;
    }

    .card h3{
      margin:15px 0 10px;
      color:#00ffe5;
    }

    .price{
      font-size:28px;
      color:#ffd700;
      margin:10px 0;
      font-weight:bold;
      text-shadow:0 0 10px #ffd700;
    }

    .buy{
      display:inline-block;
      margin:15px 0 25px;
      padding:12px 24px;
      background:#00ffe5;
      color:#111;
      border-radius:12px;
      text-decoration:none;
      font-weight:bold;
      transition:0.3s;
    }

    .buy:hover{
      transform:scale(1.1);
      box-shadow:0 0 20px #00ffe5;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#02040c;
      color:#888;
      border-top:1px solid #111;
    }
  </style>
</head>
<body>

<!-- Hero -->
<section class="hero">
  <div class="hero-content">
    <img src="https://i.ibb.co/5nq6V7H/freefire-character.png" alt="Free Fire Character">
    <h1>THALAMAI GAMERS</h1>
    <p>🔥 Free Fire ID Sale • Safe & Trusted • Instant Delivery 🔥</p>
  </div>
</section>

<!-- ID Sale -->
<section class="section">
  <h2>🔥 Premium Free Fire IDs</h2>

  <div class="cards">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=800&auto=format&fit=crop">
      <h3>Legendary ID</h3>
      <div class="price">₹499</div>
      <a href="#" class="buy">Buy Now</a>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?q=80&w=800&auto=format&fit=crop">
      <h3>Elite ID</h3>
      <div class="price">₹799</div>
      <a href="#" class="buy">Buy Now</a>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1486572788966-cfd3df1f5b42?q=80&w=800&auto=format&fit=crop">
      <h3>Grandmaster ID</h3>
      <div class="price">₹1,299</div>
      <a href="#" class="buy">Buy Now</a>
    </div>

  </div>
</section>

<footer>
  © 2026 Thalamai Gamers | Free Fire ID Sale
</footer>

</body>
</html>
